<style>
        /* Base styles from design system */
        body {
            background-color: #F8FAFC; /* Level 0 Surface per specs */
        }
        
        /* Form inputs per specs */
        .admin-input {
            background-color: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 0.25rem; /* lg */
            transition: all 0.2s ease-in-out;
        }
        
        .admin-input:focus {
            outline: none;
            border-color: #2563eb; /* primary_color_hex equivalent (primary-container) */
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        
        /* Card styles Level 1 */
        .admin-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 0.25rem;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-[#F8FAFC] text-on-surface font-body-md min-h-screen flex flex-col md:hidden">
<!-- TopAppBar - Adapted for sub-page / transactional flow -->
<header class="fixed top-0 w-full z-50 bg-[#F8FAFC] border-b border-outline-variant h-16 flex items-center px-margin-mobile">
<button class="text-on-surface-variant p-sm -ml-sm rounded-full hover:bg-surface-container-high transition-colors active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile text-on-surface ml-sm font-bold flex-1">Add New Officer</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-mobile py-lg pb-32 overflow-y-auto">
<!-- Form Container -->
<form class="space-y-lg">
<!-- Personal Info Section -->
<section class="admin-card p-md space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm">Personal Details</h2>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="admin-input font-body-sm text-body-sm text-on-surface p-sm w-full h-10 placeholder:text-outline" id="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="employeeId">Employee ID</label>
<input class="admin-input font-body-sm text-body-sm text-on-surface p-sm w-full h-10 placeholder:text-outline" id="employeeId" placeholder="e.g. OFC-2024-89" type="text"/>
</div>
</section>
<!-- Department & Contact Section -->
<section class="admin-card p-md space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm">Assignment &amp; Contact</h2>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="department">Department</label>
<div class="relative">
<select class="admin-input font-body-sm text-body-sm text-on-surface p-sm w-full h-10 appearance-none bg-transparent pr-xl" id="department">
<option disabled="" selected="" value="">Select department...</option>
<option value="roads">Roads &amp; Public Works</option>
<option value="parks">Parks &amp; Recreation</option>
<option value="water">Water &amp; Sanitation</option>
<option value="traffic">Traffic Management</option>
<option value="waste">Waste Management</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="contactNumber">Contact Number</label>
<input class="admin-input font-body-sm text-body-sm text-on-surface p-sm w-full h-10 placeholder:text-outline" id="contactNumber" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="emailAddress">Email Address</label>
<input class="admin-input font-body-sm text-body-sm text-on-surface p-sm w-full h-10 placeholder:text-outline" id="emailAddress" placeholder="officer@civicadmin.gov" type="email"/>
</div>
</section>
<!-- Status Section -->
<section class="admin-card p-md space-y-sm">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm">Initial Status</h2>
<div class="flex gap-md">
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="status" type="radio" value="available"/>
<div class="w-full text-center p-sm rounded-lg border border-outline-variant peer-checked:border-primary-container peer-checked:bg-primary-container peer-checked:bg-opacity-10 transition-colors flex items-center justify-center gap-sm">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary-container">Available</span>
</div>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="status" type="radio" value="offline"/>
<div class="w-full text-center p-sm rounded-lg border border-outline-variant peer-checked:border-outline peer-checked:bg-surface-variant transition-colors flex items-center justify-center gap-sm">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-on-surface-variant">Offline</span>
</div>
</label>
</div>
</section>
</form>
</main>
<!-- Bottom Action Bar for Transactional Flow -->
<div class="fixed bottom-0 w-full bg-[#F8FAFC] border-t border-outline-variant p-margin-mobile z-50 flex gap-md pb-safe">
<button class="flex-1 py-sm px-md rounded-lg border border-outline-variant bg-white text-on-surface font-label-md text-label-md active:bg-surface-variant transition-colors" type="button">
            Cancel
        </button>
<button class="flex-1 py-sm px-md rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md active:opacity-80 transition-opacity flex justify-center items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[18px]">person_add</span>
            Add Officer
        </button>
</div>
</body></html>
