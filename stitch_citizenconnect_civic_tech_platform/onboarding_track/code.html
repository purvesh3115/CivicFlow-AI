<!DOCTYPE html><html class="light" lang="en"><head>

                      "surface-dim": "#cbdbf5",

                      "surface-tint": "#0053db",
                      "secondary": "#4059aa",
                      "surface-container-highest": "#d3e4fe",
                      "on-tertiary-fixed-variant": "#5a00c6"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",

              },
              "spacing": {
                      "margin-desktop": "32px",
                      "base": "8px",
                      "container-max": "1280px",
                      "md": "16px",
                      "sm": "8px",
                      "gutter": "24px",
                      "xs": "4px",

              "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
        }
        
        .onboarding-gradient {
            background: linear-gradient(135deg, theme('colors.surface') 0%, theme('colors.surface-container-low') 100%);
        }
        
        .timeline-line {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            height: 2px;
            background-color: theme('colors.outline-variant');
            z-index: 0;
        }
        
        .timeline-progress {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 50%;
            height: 2px;
            background-color: theme('colors.primary');
            z-index: 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Onboarding flow, navigation shell is suppressed -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-3xl translate-y-1/3 -translate-x-1/4 pointer-events-none"></div>
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-2xl shadow-[0px_20px_25px_-5px_rgba(0,0,0,0.1)] p-xl relative z-10 border border-outline-variant/30 flex flex-col min-h-[600px]">
<!-- Skip action top right -->
<div class="flex justify-end mb-lg">
<button class="text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded px-2 py-1">
                    Skip
                </button>
</div>
<!-- Content Area -->
<div class="flex-grow flex flex-col items-center text-center">
<!-- Visual Illustration: Complaint Timeline -->
<div class="w-full h-48 mb-xl relative flex items-center justify-center bg-surface-container-low rounded-xl p-md overflow-hidden">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-primary/10 via-transparent to-transparent opacity-50"></div>
<div class="relative w-full max-w-[320px] flex justify-between items-center z-10 px-md">
<div class="timeline-line"></div>
<div class="timeline-progress"></div>
<!-- Step 1: Submitted -->
<div class="flex flex-col items-center relative z-10 gap-sm">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shadow-md shadow-primary/20">
<span class="material-symbols-outlined text-on-primary" data-icon="send">send</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Submitted</span>
</div>
<!-- Step 2: Verified (Active) -->
<div class="flex flex-col items-center relative z-10 gap-sm -mt-md">
<div class="w-14 h-14 rounded-full bg-surface-container-lowest border-4 border-primary flex items-center justify-center shadow-lg shadow-primary/20 scale-110">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="search">search</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Verified</span>
</div>
<!-- Step 3: Resolved -->
<div class="flex flex-col items-center relative z-10 gap-sm">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-outline" data-icon="check_circle">check_circle</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Resolved</span>
</div>
</div>
</div>
<!-- Text Content -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-md">
                    Track Every Complaint
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-4">
                    Stay informed from submission to resolution.
                </p>
</div>
<!-- Bottom Actions & Progress -->
<div class="mt-auto">
<!-- Progress Indicator -->
<div class="flex justify-center gap-2 mb-xl">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<!-- Action Buttons -->
<div class="flex justify-between items-center gap-md">
<button class="px-6 py-3 font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant/50 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-primary min-w-[100px]">
                        Back
                    </button>
<button class="px-8 py-3 bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md rounded-xl shadow-md shadow-primary/20 transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background min-w-[140px] flex items-center justify-center gap-2 group">
                        Next
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
