<!-- Interactive Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otp-form');
            const verifyBtn = document.getElementById('verify-btn');
            const successFeedback = document.getElementById('success-feedback');
            const resendBtn = document.getElementById('resend-btn');
            const timerSpan = document.getElementById('timer');
            
            // OTP Input Logic (Auto-advance and Backspace handling)
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Prevent non-numeric input
                input.addEventListener('keypress', (e) => {
                    if (e.key < '0' || e.key > '9') {
                        e.preventDefault();
                    }
                });
            });

            // Form Submission Simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Basic validation: check if all filled
                const allFilled = Array.from(inputs).every(input => input.value !== '');
                if (!allFilled) {
                    // Slight shake animation for error
                    form.classList.add('animate-[shake_0.5s_ease-in-out]');
                    setTimeout(() => form.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
                    return;
                }

                // Loading State
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> <span class="ml-2">Verifying...</span>';
                verifyBtn.classList.add('opacity-80', 'cursor-not-allowed');
                verifyBtn.disabled = true;
                inputs.forEach(i => i.disabled = true);

                // Simulate API Call
                setTimeout(() => {
                    verifyBtn.classList.add('hidden');
                    
                    successFeedback.classList.remove('hidden');
                    // Trigger reflow
                    void successFeedback.offsetWidth; 
                    successFeedback.classList.remove('scale-95', 'opacity-0');
                    successFeedback.classList.add('scale-100', 'opacity-100');

                    // Redirect simulation
                    setTimeout(() => {
                        window.location.href = '#home'; // Placeholder destination
                    }, 1500);
                }, 1500);
            });

            // Timer Logic for Resend
            let timeLeft = 30;
            const timerInterval = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerSpan.textContent = `00:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.innerHTML = 'Resend OTP';
                    resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
                    resendBtn.classList.add('text-primary', 'hover:text-on-primary-fixed-variant');
                    resendBtn.disabled = false;
                }
            }, 1000);

            // Resend Click Simulation
            resendBtn.addEventListener('click', () => {
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
                // Reset timer visually (actual logic omitted for brevity)
                resendBtn.innerHTML = 'Sent!';
                setTimeout(() => {
                    resendBtn.innerHTML = 'Resend OTP (<span id="timer">00:30</span>)';
                    resendBtn.classList.add('text-outline', 'cursor-not-allowed');
                    resendBtn.classList.remove('text-primary', 'hover:text-on-primary-fixed-variant');
                    resendBtn.disabled = true;
                }, 2000);
            });
        });
    </script>
