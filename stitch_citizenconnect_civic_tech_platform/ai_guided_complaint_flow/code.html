<body class="bg-background text-on-background font-body-md h-screen flex flex-col overflow-hidden">

<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full">

</button>

<!-- Progress Indicator -->

<!-- Step 2: Upcoming -->
<div class="flex flex-col items-center">

                    2
                </div>

</div>
<!-- Step 3: Upcoming -->

</div>

<div class="bg-ai-surface border border-ai-border rounded-[16px] rounded-bl-none p-md text-on-secondary-fixed-variant shadow-sm max-w-[90%] md:max-w-[75%]">

</div>

<span>Profile</span>
</button>

<script>
        // Auto-resize textarea
        const tx = document.getElementsByTagName("textarea");
        for (let i = 0; i < tx.length; i++) {
            tx[i].setAttribute("style", "height:" + (tx[i].scrollHeight) + "px;overflow-y:hidden;");
            tx[i].addEventListener("input", OnInput, false);
        }

        function OnInput() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        }
    </script>
