<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CitizenConnect - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "on-background": "#0b1c30",

                        "on-secondary-container": "#1d3989",
                        "primary": "#004ac6",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#264191",
                        "tertiary": "#6a1edb",
                        "on-error": "#ffffff",
                        "outline": "#737686",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#f7edff",
                        "inverse-surface": "#213145",

                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed": "#00164e",
                        "surface": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#b6c4ff",

                        "secondary": "#4059aa",

                    },
                    "borderRadius": {

                    },
                    "spacing": {

                    },
                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus-within {
            box-shadow: 0 0 0 4px rgba(0, 74, 198, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-md md:text-headline-md font-bold text-primary">CitizenConnect</span>
</div>
<div class="hidden md:flex gap-lg font-label-md text-label-md text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Help</a>
<a class="hover:text-primary transition-colors" href="#">Sign In</a>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-lg md:p-xl">
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join CitizenConnect to engage with your local government.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none" id="fullName" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="mobile">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">phone_iphone</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none" id="mobile" placeholder="(555) 123-4567" type="tel">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none" id="email" placeholder="jane.doe@example.com" type="email">
</div>
</div>
<!-- Location -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="location">City / Region</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">map</span>
<select class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none appearance-none" id="location">
<option disabled="" selected="" value="">Select your location</option>
<option value="downtown">Downtown District</option>
<option value="northside">Northside Borough</option>
<option value="eastend">East End</option>
<option value="westvalley">West Valley</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none" id="password" placeholder="••••••••" type="password">
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full pl-xl pr-xl py-sm border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-all outline-none" id="confirmPassword" placeholder="••••••••" type="password">
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md py-md rounded-full shadow-md transition-all active:scale-95 flex items-center justify-center gap-sm" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-sm">
                    Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign In</a>
</p>
</form>
</div>
</main>
<!-- Navigation is suppressed due to linear/transactional intent (Registration) -->
</body></html>
