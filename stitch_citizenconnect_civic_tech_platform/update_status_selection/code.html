<script>
        // Simple script to handle visual update of custom radio buttons based on selection
        document.addEventListener('DOMContentLoaded', () => {
            const radios = document.querySelectorAll('input[type="radio"][name="complaint_status"]');
            
            function updateRadioVisuals() {
                radios.forEach(radio => {
                    const icon = radio.nextElementSibling.querySelector('.radio-icon');
                    if (radio.checked) {
                        icon.textContent = 'radio_button_checked';
                    } else {
                        icon.textContent = 'radio_button_unchecked';
                    }
                });
            }

            // Initial setup
            updateRadioVisuals();

            // Listen for changes
            radios.forEach(radio => {
                radio.addEventListener('change', updateRadioVisuals);
            });
        });
    </script>
