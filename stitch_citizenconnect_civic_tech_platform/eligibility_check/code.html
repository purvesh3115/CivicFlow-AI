<style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified for focused flow - simplified, no nav elements as it's a linear form) -->
<header class="bg-surface w-full top-0 sticky shadow-sm z-40">
<div class="flex justify-between items-center px-gutter py-md w-full max-w-container-max mx-auto">
<div class="flex items-center gap-sm cursor-pointer active:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary text-[24px]">account_balance</span>
<span class="font-headline-md text-headline-md font-bold text-primary">CivicLink</span>
</div>
<div>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-xl pb-[120px] px-margin-mobile md:px-margin-desktop w-full max-w-[800px] mx-auto">
<!-- Progress Header -->
<div class="w-full mb-xl">
<div class="flex justify-between items-end mb-sm">
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-xs">Basic Information</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Step 1 of 3: Let's determine your initial eligibility.</p>
</div>
<div class="font-label-md text-label-md text-primary font-semibold">
                    33%
                </div>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 33%;"></div>
</div>
</div>
<!-- Form Section -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-lg md:p-xl border border-outline-variant/30">
<form class="space-y-xl">
<!-- Question 1: Residency -->
<fieldset class="space-y-md">
<legend class="font-headline-sm text-headline-sm text-on-background w-full border-b border-surface-variant pb-sm mb-md">
                        Are you currently a resident of the municipality?
                    </legend>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<!-- Option: Yes -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-lowest p-md hover:bg-surface-container-low transition-colors border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary-container/50">
<input checked="" class="peer sr-only" name="residency" type="radio" value="yes">
<div class="flex items-start w-full gap-md">
<div class="flex h-6 items-center">
<div class="h-5 w-5 rounded-full border border-outline flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="h-2 w-2 rounded-full bg-surface-container-lowest opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-background font-semibold">Yes</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-xs">I have lived here for more than 6 months.</span>
</div>
</div>
<!-- Active State Border Override (Tailwind Peer) -->
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option: No -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-lowest p-md hover:bg-surface-container-low transition-colors border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary-container/50">
<input class="peer sr-only" name="residency" type="radio" value="no">
<div class="flex items-start w-full gap-md">
<div class="flex h-6 items-center">
<div class="h-5 w-5 rounded-full border border-outline flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="h-2 w-2 rounded-full bg-surface-container-lowest opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-background font-semibold">No</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-xs">I live outside the municipality limits.</span>
</div>
</div>
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
</div>
</fieldset>
<!-- Question 2: Age Range (Selection Cards) -->
<fieldset class="space-y-md">
<legend class="font-headline-sm text-headline-sm text-on-background w-full border-b border-surface-variant pb-sm mb-md">
                        Which age group do you belong to?
                    </legend>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md">
<label class="relative flex flex-col items-center justify-center text-center cursor-pointer rounded-xl border bg-surface-container-lowest p-md hover:bg-surface-container-low hover:-translate-y-1 transition-all duration-200 border-outline-variant shadow-sm focus-within:border-primary">
<input class="peer sr-only" name="age" type="radio" value="under_18">
<span class="material-symbols-outlined text-[32px] text-secondary mb-sm opacity-70 peer-checked:opacity-100 peer-checked:text-primary transition-colors">child_care</span>
<span class="font-label-md text-label-md text-on-background font-semibold">Under 18</span>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined filled text-primary text-[16px]">check_circle</span>
</div>
</label>
<label class="relative flex flex-col items-center justify-center text-center cursor-pointer rounded-xl border bg-surface-container-lowest p-md hover:bg-surface-container-low hover:-translate-y-1 transition-all duration-200 border-outline-variant shadow-sm focus-within:border-primary">
<input checked="" class="peer sr-only" name="age" type="radio" value="18_64">
<span class="material-symbols-outlined text-[32px] text-secondary mb-sm opacity-70 peer-checked:opacity-100 peer-checked:text-primary transition-colors">person</span>
<span class="font-label-md text-label-md text-on-background font-semibold">18 - 64</span>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined filled text-primary text-[16px]">check_circle</span>
</div>
</label>
<label class="relative flex flex-col items-center justify-center text-center cursor-pointer rounded-xl border bg-surface-container-lowest p-md hover:bg-surface-container-low hover:-translate-y-1 transition-all duration-200 border-outline-variant shadow-sm focus-within:border-primary">
<input class="peer sr-only" name="age" type="radio" value="65_plus">
<span class="material-symbols-outlined text-[32px] text-secondary mb-sm opacity-70 peer-checked:opacity-100 peer-checked:text-primary transition-colors">elderly</span>
<span class="font-label-md text-label-md text-on-background font-semibold">65 and older</span>
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined filled text-primary text-[16px]">check_circle</span>
</div>
</label>
</div>
</fieldset>
<!-- Question 3: Annual Income -->
<fieldset class="space-y-md">
<legend class="font-headline-sm text-headline-sm text-on-background w-full border-b border-surface-variant pb-sm mb-md">
                        Estimated Annual Household Income
                    </legend>
<div class="flex flex-col gap-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="income">Select the range that best applies to your household before taxes.</label>
<div class="relative w-full md:w-2/3 lg:w-1/2">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant text-on-background font-body-md text-body-md rounded-md px-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container/50 transition-all cursor-pointer" id="income" name="income">
<option disabled="" selected="" value="">Select income range...</option>
<option value="tier1">Under $25,000</option>
<option value="tier2">$25,000 - $49,999</option>
<option value="tier3">$50,000 - $74,999</option>
<option value="tier4">$75,000 - $99,999</option>
<option value="tier5">$100,000 or more</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</fieldset>
</form>
</div>
</main>
<!-- Bottom Navigation/Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface shadow-[0px_-1px_3px_rgba(0,0,0,0.05)] border-t border-outline-variant/30 z-50 px-gutter py-md">
<div class="max-w-[800px] mx-auto flex justify-between items-center">
<button class="font-label-md text-label-md text-primary bg-transparent hover:bg-surface-container-low px-lg py-sm rounded-full transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                Back
            </button>
<button class="font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant active:scale-95 px-xl py-sm rounded-full shadow-sm transition-all flex items-center gap-xs">
                Next Step
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
