<!DOCTYPE html><html lang="en"><head>

                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-sm": ["Manrope"],

<style>
        body {
            background-color: #F8FAFC; /* Fallback to Level 0 */
        }
    </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-background z-50">
<!-- Separation logic handled by shadow below instead of border -->
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 bg-surface-container-lowest dark:bg-inverse-surface shadow-sm">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-primary dark:text-inverse-primary active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">Personal Information</h1>
</div>
<div>
<button aria-label="Edit" class="text-primary font-label-md text-label-md hover:bg-surface-container-high px-4 py-2 rounded-full transition-colors active:scale-95 duration-150 flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
<span class="hidden sm:inline">Edit</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-lg flex flex-col gap-lg">
<!-- Profile Summary Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-lg flex flex-col sm:flex-row items-center gap-lg hover:shadow-[0px_4px_6px_rgba(0,0,0,0.05),0px_15px_20px_-3px_rgba(0,0,0,0.05)] transition-shadow duration-300 transform hover:-translate-y-[1px]">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center text-primary relative overflow-hidden flex-shrink-0">
<span class="material-symbols-outlined text-display-lg" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<div class="text-center sm:text-left flex-grow">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Purvesh</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Citizen Account</p>
</div>
</div>
<!-- Information Fields -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-0 overflow-hidden hover:shadow-[0px_4px_6px_rgba(0,0,0,0.05),0px_15px_20px_-3px_rgba(0,0,0,0.05)] transition-shadow duration-300 transform hover:-translate-y-[1px]">
<div class="divide-y divide-outline-variant/30">
<!-- Full Name -->
<div class="p-lg flex flex-col sm:flex-row sm:items-center justify-between gap-sm group">
<div class="flex flex-col gap-xs w-full sm:w-1/3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Full Name</label>
<div class="font-body-lg text-body-lg text-on-surface">Purvesh</div>
</div>
</div>
<!-- Phone Number -->
<div class="p-lg flex flex-col sm:flex-row sm:items-center justify-between gap-sm group">
<div class="flex flex-col gap-xs w-full sm:w-1/3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Phone Number</label>
<div class="font-body-lg text-body-lg text-on-surface">+1 (555) 123-4567</div>
</div>
</div>
<!-- Email Address -->
<div class="p-lg flex flex-col sm:flex-row sm:items-center justify-between gap-sm group">
<div class="flex flex-col gap-xs w-full sm:w-1/3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Email Address</label>
<div class="font-body-lg text-body-lg text-on-surface">purvesh.citizen@example.com</div>
</div>
</div>
<!-- Home Address -->
<div class="p-lg flex flex-col sm:flex-row sm:items-start justify-between gap-sm group">
<div class="flex flex-col gap-xs w-full sm:w-2/3">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Home Address</label>
<div class="font-body-lg text-body-lg text-on-surface">123 Civic Center Blvd, Apt 4B<br>Metropolis, NY 10001</div>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="flex justify-end mt-md pb-xl">
<button class="bg-primary text-on-primary font-label-md text-label-md px-lg py-md rounded-lg shadow-sm opacity-50 cursor-not-allowed transition-all duration-200 flex items-center gap-sm" disabled="">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                Save Changes
            </button>
</div>
</main>
