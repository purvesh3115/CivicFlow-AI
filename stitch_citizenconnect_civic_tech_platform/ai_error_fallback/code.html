<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background flex justify-between items-center w-full px-margin-mobile h-14 z-50 sticky top-0 shadow-sm border-b border-surface-container-highest">
<button aria-label="Menu" class="text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-full p-2">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed text-center flex-grow">
            CitizenConnect AI
        </div>
<button aria-label="History" class="text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-full p-2">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter mb-20 md:mb-0 max-w-3xl mx-auto w-full text-center">
<!-- Error Illustration / Icon -->
<div class="mb-lg relative inline-flex items-center justify-center w-32 h-32 rounded-full bg-surface-container-low border border-surface-container-highest shadow-sm">
<span class="material-symbols-outlined text-[64px] text-text-secondary" style="font-variation-settings: 'FILL' 0;">
                robot_2
            </span>
<!-- Decorative "sad" spark -->
<div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-surface-bright flex items-center justify-center shadow-sm border border-surface-variant">
<span class="material-symbols-outlined text-sm text-text-secondary">close</span>
</div>
</div>
<!-- Error Messaging -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-text-primary mb-sm">
            Sorry, I couldn't understand that.
        </h1>
<p class="font-body-lg text-body-lg text-text-secondary mb-xl max-w-lg">
            Try explaining your question in a different way, or explore some common topics below.
        </p>
<!-- Suggested Actions Grid -->
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-md mb-xl text-left">
<!-- Suggestion Card 1 -->
<button class="bg-on-tertiary border border-surface-variant rounded-xl p-md flex flex-col hover:border-secondary transition-colors group shadow-sm">
<div class="mb-sm text-secondary">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">report</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-text-primary mb-xs">Report a Complaint</h3>
<p class="font-body-sm text-body-sm text-text-secondary">File a new issue with local services.</p>
</button>
<!-- Suggestion Card 2 -->
<button class="bg-on-tertiary border border-surface-variant rounded-xl p-md flex flex-col hover:border-secondary transition-colors group shadow-sm">
<div class="mb-sm text-secondary">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">my_location</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-text-primary mb-xs">Track Complaint</h3>
<p class="font-body-sm text-body-sm text-text-secondary">Check the status of an existing ticket.</p>
</button>
<!-- Suggestion Card 3 -->
<button class="bg-on-tertiary border border-surface-variant rounded-xl p-md flex flex-col hover:border-secondary transition-colors group shadow-sm">
<div class="mb-sm text-secondary">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">account_balance</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-text-primary mb-xs">Government Services</h3>
<p class="font-body-sm text-body-sm text-text-secondary">Browse general citizen services.</p>
</button>
</div>
<!-- Primary Action -->
<button class="bg-primary-container text-on-primary font-label-md text-label-md px-xl py-md rounded-full shadow-md hover:opacity-90 transition-opacity flex items-center gap-sm">
<span class="material-symbols-outlined text-sm">refresh</span>
            TRY AGAIN
        </button>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface/90 backdrop-blur-md border-t border-outline-variant dark:border-on-surface-variant fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2">

<span class="material-symbols-outlined mb-1" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm">AI Chat</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant opacity-70 hover:bg-surface-container-low dark:hover:bg-inverse-surface rounded-xl p-2 w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance">account_balance</span>
<span class="font-label-sm text-label-sm">Services</span>
</a>

<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
