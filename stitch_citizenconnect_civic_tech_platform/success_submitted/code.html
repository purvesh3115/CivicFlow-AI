<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">

<title>Complaint Submitted Successfully</title>
<!-- Material Symbols -->

                        "on-primary-container": "#eeefff",

                        "on-primary-fixed-variant": "#003ea8",
                        "surface-dim": "#cbdbf5",
                        "on-tertiary-container": "#f7edff",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "on-tertiary-fixed": "#25005a",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#264191",
                        "surface-tint": "#0053db",
                        "on-surface": "#0b1c30",
                        "primary-container": "#2563eb",
                        "inverse-on-surface": "#eaf1ff",

                        "surface-container-low": "#eff4ff",
                        "surface-variant": "#d3e4fe",
                        "secondary-fixed": "#dce1ff",
                        "surface-bright": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "outline": "#737686",
                        "tertiary": "#6a1edb",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#00174b",
                        "tertiary-container": "#8343f4",
                        "inverse-primary": "#b4c5ff",
                        "surface-container": "#e5eeff",
                        "surface-container-highest": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "xl": "40px",
                        "xs": "4px",
                        "lg": "24px",
                        "margin-desktop": "32px",
                        "base": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Manrope"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Manrope"],

                    },
                    "fontSize": {

                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Animations for Success State */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideUpFade {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .animate-pop { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-slide-up-1 { animation: slideUpFade 0.5s ease-out 0.2s forwards; opacity: 0; }
        .animate-slide-up-2 { animation: slideUpFade 0.5s ease-out 0.3s forwards; opacity: 0; }
        .animate-slide-up-3 { animation: slideUpFade 0.5s ease-out 0.4s forwards; opacity: 0; }

        .pulse-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #004ac6; /* primary */
            animation: pulseRing 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 0;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center px-margin-mobile md:px-margin-desktop py-xl relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed blur-[100px] opacity-40 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed blur-[80px] opacity-30 pointer-events-none"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md mx-auto flex flex-col items-center z-10 relative">
<!-- Celebration Icon -->
<div class="relative mb-lg animate-pop">
<div class="pulse-container absolute inset-0"></div>
<div class="relative z-10 w-24 h-24 rounded-full bg-primary flex items-center justify-center shadow-[0_10px_25px_-5px_rgba(0,74,198,0.4)]">
<span class="material-symbols-outlined text-on-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
</div>
<!-- Title & Subtitle -->
<div class="text-center mb-xl animate-slide-up-1">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface mb-xs">
                Complaint Submitted Successfully
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Your request has been securely logged with the local authorities.
            </p>
</div>
<!-- Details Bento Card -->
<div class="w-full glass-card rounded-xl shadow-[0px_1px_3px_rgba(0,0,0,0.05),0px_10px_15px_-3px_rgba(0,0,0,0.05)] border border-surface-variant p-lg space-y-md animate-slide-up-2 relative overflow-hidden">
<!-- Subtle decorative gradient inside card -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed rounded-full blur-2xl opacity-30 -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
<!-- ID Row -->
<div class="flex items-center justify-between border-b border-outline-variant/30 pb-md relative z-10">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-xs">Complaint ID</p>
<p class="font-headline-sm text-headline-sm text-primary font-bold" id="complaint-id">#CC10245</p>
</div>
<button aria-label="Copy Complaint ID" class="w-12 h-12 rounded-full flex items-center justify-center bg-surface-container-high hover:bg-surface-variant transition-colors text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest group" id="copy-btn" onclick="copyComplaintId()">
<span class="material-symbols-outlined transition-transform group-active:scale-90" style="font-variation-settings: 'FILL' 0;">
                        content_copy
                    </span>
</button>
</div>
<!-- Status & Date Grid -->
<div class="grid grid-cols-2 gap-md pt-xs relative z-10">
<div class="space-y-xs">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Status</p>
<div class="inline-flex items-center px-3 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm w-max">
<span class="material-symbols-outlined text-[16px] mr-1" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
                        Submitted
                    </div>
</div>
<div class="space-y-xs">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Date</p>
<p class="font-body-md text-body-md text-on-surface font-medium" id="current-date">
<!-- Date will be injected via JS -->
</p>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm mt-xl animate-slide-up-3">
<button class="w-full bg-primary text-on-primary py-3 px-lg rounded-full font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-all active:scale-[0.98] shadow-sm flex items-center justify-center gap-2 group">
<span>Track Complaint</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="w-full bg-transparent border-2 border-outline-variant text-primary py-3 px-lg rounded-full font-label-md text-label-md hover:bg-surface-variant transition-all active:scale-[0.98] flex items-center justify-center">
                Back to Home
            </button>
</div>
</main>
<!-- Toast Notification for Copy -->
<div class="fixed bottom-margin-mobile left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-lg py-sm rounded-full font-label-md text-label-md shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 pointer-events-none" id="toast">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
        ID Copied to clipboard
    </div>
<script>
        // Set Current Date dynamically to make it feel real
        document.addEventListener('DOMContentLoaded', () => {
            const dateElement = document.getElementById('current-date');
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            dateElement.textContent = new Date().toLocaleDateString('en-US', options);
        });

        // Copy to Clipboard functionality with Toast
        function copyComplaintId() {
            const idText = document.getElementById('complaint-id').innerText;
            const btn = document.getElementById('copy-btn');
            const icon = btn.querySelector('.material-symbols-outlined');
            const toast = document.getElementById('toast');
            
            navigator.clipboard.writeText(idText).then(() => {
                // Change icon temporarily to indicate success
                icon.textContent = 'check';
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('text-primary');
                
                // Show toast
                toast.classList.remove('translate-y-20', 'opacity-0');
                
                setTimeout(() => {
                    // Revert icon
                    icon.textContent = 'content_copy';
                    btn.classList.remove('bg-primary-container', 'text-on-primary-container');
                    btn.classList.add('text-primary');
                    
                    // Hide toast
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body></html>
