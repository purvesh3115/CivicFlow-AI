<style>
        .waveform-bar {
            animation: pulse 1s infinite alternate ease-in-out;
        }
        .waveform-bar:nth-child(1) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(2) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.5s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.6s; }
        .waveform-bar:nth-child(6) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(7) { animation-delay: 0.2s; }
        
        @keyframes pulse {
            0% { transform: scaleY(0.2); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }
        
        .mic-ripple {
            animation: ripple 2s infinite;
        }
        
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(15, 118, 110, 0); }
            100% { box-shadow: 0 0 0 0 rgba(15, 118, 110, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-14 flat no shadows md:hidden">
<button class="p-2 -ml-2 text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed">CitizenConnect AI</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-4xl mx-auto relative z-10">
<!-- Animated Waveform -->
<div class="h-32 flex items-center justify-center gap-2 mb-12">
<div class="waveform-bar w-2 h-12 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-24 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-16 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-32 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-20 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-28 bg-secondary rounded-full"></div>
<div class="waveform-bar w-2 h-14 bg-secondary rounded-full"></div>
</div>
<!-- Status Text -->
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-secondary mb-4 text-center">Listening...</h2>
<!-- Transcription Box -->
<div class="bg-ai-surface border border-ai-border rounded-xl p-6 w-full max-w-lg mb-12 shadow-sm text-center relative overflow-hidden">
<p class="font-body-md text-body-md text-text-secondary mb-2">You said:</p>
<p class="font-headline-sm text-headline-sm text-text-primary">"There is garbage near my house."</p>
</div>
<!-- Microphone Button -->
<button class="w-24 h-24 rounded-full bg-[#0F766E] text-white flex items-center justify-center mb-12 mic-ripple shadow-lg hover:bg-secondary-container hover:text-on-secondary-container transition-all">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<!-- Action Buttons -->
<div class="flex gap-4 w-full max-w-sm justify-center">
<button class="flex-1 py-3 px-6 rounded-lg bg-surface border border-secondary text-secondary font-label-md text-label-md hover:bg-secondary-container transition-colors">
                EDIT
            </button>
<button class="flex-1 py-3 px-6 rounded-lg bg-primary-container text-white font-label-md text-label-md hover:opacity-90 transition-opacity shadow-md">
                CONFIRM
            </button>
</div>
</main>
<!-- Navigation suppressed per rules (transactional task/AI interaction) -->
<script>
        // Simple interaction for the mic button to toggle state for demonstration
        const micButton = document.querySelector('button.mic-ripple');
        const statusText = document.querySelector('h2');
        const waveform = document.querySelector('.flex.items-center.gap-2.mb-12');
        
        let isListening = true;
        
        micButton.addEventListener('click', () => {
            isListening = !isListening;
            if(isListening) {
                statusText.textContent = "Listening...";
                micButton.classList.add('mic-ripple');
                waveform.style.opacity = '1';
                micButton.style.backgroundColor = '#0F766E';
            } else {
                statusText.textContent = "Paused";
                micButton.classList.remove('mic-ripple');
                waveform.style.opacity = '0.3';
                micButton.style.backgroundColor = '#737686';
            }
        });
    </script>
</body></html>
