<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom map placeholder styling */
        .map-placeholder {
            background-color: #cbdbf5; /* surface-dim */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden Nav, Back Button instead of menu) -->
<header class="bg-surface shadow-sm docked full-width top-0 sticky z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-md">
<div class="flex items-center gap-sm">
<button aria-label="Go back" class="text-primary p-2 hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-primary">Report Issue</h1>
</div>
<!-- Removed avatar for transactional flow -->
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-2xl mx-auto px-margin-mobile md:px-0 py-lg pb-32">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 4</span>
<span class="font-label-sm text-label-sm text-primary font-semibold">Details</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2">
<div class="bg-primary h-2 rounded-full transition-all duration-500" style="width: 50%"></div>
</div>
</div>
<!-- Section: What happened? -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-outline-variant/30 mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary filled">edit_document</span>
                What happened?
            </h2>
<div class="space-y-6">
<!-- Complaint Title -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="complaint-title">Complaint Title</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="complaint-title" placeholder="e.g. Pothole on Main St." type="text">
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Keep it brief and descriptive.</p>
</div>
<!-- Description -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="description">Description</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow resize-y" id="description" placeholder="Provide more details about the issue..." rows="4"></textarea>
</div>
</div>
</section>
<!-- Section: Where did it happen? -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-outline-variant/30 mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary filled">pin_drop</span>
                Where did it happen?
            </h2>
<div class="space-y-4 mb-6">
<!-- Current Location Option -->
<button class="w-full flex items-center gap-4 p-4 border border-outline-variant rounded-lg hover:bg-surface-container-low hover:border-primary transition-colors text-left group">
<div class="bg-primary-container text-on-primary-container p-2 rounded-full group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">my_location</span>
</div>
<div>
<div class="font-label-md text-label-md font-semibold text-on-surface">Use Current Location</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Requires GPS access</div>
</div>
</button>
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">or</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Search Location -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" placeholder="Search for an address or landmark..." type="text">
</div>
</div>
<!-- Mini Map View -->
<div class="w-full h-48 rounded-lg overflow-hidden border border-outline-variant relative">
<img class="w-full h-full object-cover" data-alt="A clean, modern top-down map interface showing a city grid. The map uses a minimalist corporate style with a light mode aesthetic, featuring soft whites, light blues (primary color #004ac6 accents), and subtle grey roads. A stylized blue location pin sits in the center. The mood is efficient, highly legible, and deeply integrated into a civic trust platform." data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBi2UMNUxL1b4mU4pwmEu3Azz0zoOcll5w09gbM6YJR9VGSns76uCRGDeKV1EKqkFG5JiWRhew9axOaK0mtgKs2ozUDipPRF66bwWP9mOuqJlF1j9mwzGNV7YoH9Y-LbLnTbWxOB0q76XLdrYMfln_6xGySRugkmOPC0GgJf9aoa5eI8Sj1aht6-4n-x2o7krkf_B7uZDlaJpCnCVPtQCl_7HERnbdZ51C3Vzbvtce6Io5lnIpEa8BP">
<!-- Center Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">location_on</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2 text-center">Drag map to refine location</p>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 p-margin-mobile shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
<div class="max-w-2xl mx-auto flex justify-end">
<button class="bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md px-8 py-3 rounded-lg shadow-sm hover:shadow-md transition-all flex items-center gap-2">
                Continue
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<!-- Suppressed Nav Shells (Intent: Linear Transactional Flow) -->
<!-- BottomNavBar intentionally omitted as per Shell Visibility rules (Transactional) -->
<!-- NavigationDrawer intentionally omitted -->
</body></html>
