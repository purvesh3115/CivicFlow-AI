<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">
<!-- Canvas Layout -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-level-1 overflow-hidden">
<!-- Header Section -->
<div class="px-lg pt-xl pb-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container mb-md">
<span class="material-symbols-outlined text-on-primary-container text-[32px]">location_on</span>
</div>
<h1 class="font-headline-lg md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">CitizenConnect</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Welcome back. Please log in to continue.</p>
</div>
<!-- Form Section -->
<form class="px-lg pb-xl space-y-md">
<!-- Mobile Number Field -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="mobile">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span>
</span>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all duration-200" id="mobile" name="mobile" placeholder="Enter your 10-digit number" required="" type="tel">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-sm">
<button class="w-full min-h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors shadow-sm" type="submit">
                    Login
                </button>
<div class="relative flex py-sm items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm">OR</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full min-h-[48px] bg-transparent border border-primary text-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined mr-sm text-[20px]">sms</span>
                    Continue with OTP
                </button>
</div>
<!-- Register Link -->
<div class="pt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Register</a>
</p>
</div>
</form>
</div>
