<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Field Map - Officer App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container": "#ededf9",
                        "on-primary-fixed-variant": "#003ea8",

                        "inverse-surface": "#2e3039",

                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#bc4800",
                        "background": "#faf8ff",
                        "secondary": "#006a63",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-background": "#191b23",
                        "surface": "#faf8ff",
                        "outline": "#737686",
                        "on-secondary-fixed-variant": "#00504a",
                        "on-secondary-container": "#006f67",
                        "surface-tint": "#0053db",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f3fe",
                        "inverse-on-surface": "#f0f0fb",
                        "on-tertiary-fixed": "#360f00",
                        "on-tertiary-container": "#ffede6",
                        "secondary-container": "#99efe5",
                        "surface-variant": "#e1e2ed",
                        "surface-container-high": "#e7e7f3",
                        "secondary-fixed": "#9cf2e8",
                        "primary-container": "#2563eb",
                        "outline-variant": "#c3c6d7",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b4c5ff",
                        "primary": "#004ac6",
                        "on-primary-container": "#eeefff",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#faf8ff",
                        "surface-container-highest": "#e1e2ed",
                        "tertiary": "#943700",
                        "on-secondary": "#ffffff",
                        "on-surface": "#191b23",
                        "on-surface-variant": "#434655",
                        "on-primary-fixed": "#00174b",
                        "surface-dim": "#d9d9e5",
                        "on-secondary-fixed": "#00201d",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#80d5cb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sidebar-width": "260px",
                        "sm": "8px",
                        "xl": "32px",
                        "base": "4px",
                        "2xl": "48px",
                        "md": "16px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "code": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],

                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .map-bg {
            background-color: #f0f0fb;
            /* Placeholder for actual map implementation */
            background-image: radial-gradient(#c3c6d7 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bottom-sheet {
            box-shadow: 0 -4px 20px -2px rgba(0, 0, 0, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen flex flex-col overflow-hidden antialiased">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Field Map</h1>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
</div>
</header>
<!-- Main Map Canvas -->
<main class="flex-1 relative mt-16 mb-16 map-bg">
<!-- Static Image Map for visual context -->
<div class="absolute inset-0 bg-cover bg-center opacity-80 z-0 mix-blend-multiply" data-alt="A modern, high-contrast digital street map interface of a dense urban center, rendered in a clean light-mode aesthetic with pale blue water and crisp white roads. The map uses flat, institutional design language suitable for a government dashboard. No text or labels are visible, focusing entirely on the geometric layout of the city blocks." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBgsUj4umjv_dUw1wThaKf5QmJDuf8qHrCfSedAtWZ-8KmopouIxdB7Qvk5jd8t91Ll9TWk-5iu6izhulWDQghuh7SUfXRWx42T5AuV-CvdmiP0h7uTXpNM0vanAbjnb1PfRsFygjjJZVmIamXWDdkFwQq3_GDh-bkTud1oImiFehmAgYy_s06POCWegSuDEJnm0B0rXN3FaViPjXHLkeH8gOtqFqE_HdQJTnO7JCgsCBO6JW9BRJIc')"></div>
<!-- Map Controls -->
<div class="absolute right-margin-mobile top-margin-mobile flex flex-col gap-sm z-10">
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</button>
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="filter_list">filter_list</span>
</button>
</div>
<div class="absolute right-margin-mobile bottom-[180px] z-10">
<button class="w-12 h-12 bg-primary text-on-primary rounded-full shadow-md flex items-center justify-center hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
<!-- Markers -->
<!-- High Priority Marker -->
<div class="absolute top-1/3 left-1/4 z-10 transform -translate-x-1/2 -translate-y-full group cursor-pointer">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-error text-[32px]" data-icon="location_on" data-weight="fill">location_on</span>
<div class="absolute -top-1 right-0 w-3 h-3 bg-error rounded-full border-2 border-surface-container-lowest"></div>
</div>
</div>
<!-- Medium Priority Marker -->
<div class="absolute top-1/2 right-1/3 z-10 transform -translate-x-1/2 -translate-y-full group cursor-pointer">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-[#b45309]" data-icon="location_on" data-weight="fill">location_on</span>
</div>
</div>
<!-- Current Location (Officer) -->
<div class="absolute top-1/2 left-1/2 z-10 transform -translate-x-1/2 -translate-y-1/2">
<div class="relative flex items-center justify-center">
<div class="w-12 h-12 bg-primary opacity-20 rounded-full animate-ping absolute"></div>
<div class="w-4 h-4 bg-primary rounded-full border-2 border-surface-container-lowest z-10 relative shadow-sm"></div>
</div>
</div>
</main>
<!-- Bottom Sheet (Partially Expanded) -->
<div class="absolute bottom-16 w-full bg-surface-container-lowest rounded-t-xl bottom-sheet z-40 transition-transform duration-300 ease-in-out transform translate-y-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-2 cursor-grab">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-lg pt-sm">
<div class="flex justify-between items-start mb-sm">
<div>
<div class="flex items-center gap-xs mb-1">
<span class="bg-error/10 text-error px-2 py-0.5 rounded-sm text-[10px] font-bold uppercase tracking-wide">High Priority</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">#CC-2026-00125</span>
</div>
<h2 class="text-headline-sm font-headline-sm text-on-surface">Pothole near University Road</h2>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<div class="flex items-center gap-md mb-lg">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="route">route</span>
<span class="text-body-sm font-body-sm">2.4 km away</span>
</div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>
<span class="text-body-sm font-body-sm">Reported 2h ago</span>
</div>
</div>
<div class="flex gap-sm">
<button class="flex-1 bg-primary text-on-primary text-label-md font-label-md py-3 rounded-lg shadow-sm hover:bg-primary-container hover:text-on-primary-container transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]" data-icon="directions">directions</span>
                    Navigate
                </button>
<button class="flex-1 bg-surface-container-high text-on-surface text-label-md font-label-md py-3 rounded-lg border border-outline-variant hover:bg-surface-variant transition-colors">
                    View Details
                </button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-16 pb-safe bg-surface-container border-t border-outline-variant">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="text-label-sm font-label-sm mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="text-label-sm font-label-sm mt-1">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-transform duration-150 scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="map" data-weight="fill">map</span>
<span class="text-label-sm font-label-sm mt-1">Map</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-label-sm font-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
