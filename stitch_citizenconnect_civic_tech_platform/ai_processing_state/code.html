<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(15, 118, 110, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(15, 118, 110, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(15, 118, 110, 0); }
        }
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.2) 20%, rgba(255, 255, 255, 0.5) 60%, rgba(255, 255, 255, 0));
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Nav Shell suppressed for transactional/loading state -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter relative w-full h-full">
<!-- Background Ambient Effect -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30 flex items-center justify-center">
<div class="w-96 h-96 bg-ai-border rounded-full filter blur-[100px] animate-pulse"></div>
</div>
<div class="relative z-10 w-full max-w-md mx-auto flex flex-col items-center">
<!-- AI Indicator -->
<div class="mb-lg relative flex items-center justify-center w-24 h-24">
<div class="absolute inset-0 bg-ai-surface rounded-full border border-ai-border pulse-ring"></div>
<div class="relative w-16 h-16 bg-[#0F766E] rounded-full flex items-center justify-center shadow-[0px_4px_12px_rgba(15,23,42,0.08)] shimmer">
<span class="material-symbols-outlined text-white text-3xl" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- Title -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-text-primary mb-xl text-center">AI is thinking...</h1>
<!-- Progress Indicator -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
<ul class="space-y-sm flex flex-col">
<!-- Step 1: Complete -->
<li class="flex items-center space-x-md text-text-primary">
<div class="flex-shrink-0 w-6 h-6 flex items-center justify-center text-[#0F766E]">
<span class="material-symbols-outlined text-lg" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-body-md text-body-md">Request received</span>
</li>
<!-- Connector -->
<li class="ml-3 border-l-2 border-[#0F766E] h-4"></li>
<!-- Step 2: Active (Understanding) -->
<li class="flex items-center space-x-md text-text-primary">
<div class="flex-shrink-0 w-6 h-6 flex items-center justify-center text-[#0F766E] animate-pulse">
<span class="material-symbols-outlined text-lg" data-icon="radio_button_checked" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</div>
<span class="font-body-md text-body-md font-semibold text-[#0F766E]">Understanding your question</span>
</li>
<!-- Connector -->
<li class="ml-3 border-l-2 border-outline-variant h-4"></li>
<!-- Step 3: Pending (Finding) -->
<li class="flex items-center space-x-md text-text-secondary opacity-70">
<div class="flex-shrink-0 w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-lg" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
<span class="font-body-md text-body-md">Finding relevant information</span>
</li>
<!-- Connector -->
<li class="ml-3 border-l-2 border-outline-variant h-4"></li>
<!-- Step 4: Pending (Preparing) -->
<li class="flex items-center space-x-md text-text-secondary opacity-70">
<div class="flex-shrink-0 w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-lg" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
<span class="font-body-md text-body-md">Preparing response</span>
</li>
</ul>
</div>
<!-- Cancel Button (Ghost) -->

<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
<span>Cancel Request</span>
</button>

<script>
        // Minimal interaction logic for demonstration (progressing through states)
        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('li.flex.items-center');
            const connectors = document.querySelectorAll('li.border-l-2');
            let currentStep = 1;

            function advanceStep() {
                if (currentStep < steps.length - 1) {
                    // Current active -> complete
                    const activeStep = steps[currentStep];
                    const activeIcon = activeStep.querySelector('.material-symbols-outlined');
                    activeIcon.textContent = 'check_circle';
                    activeStep.classList.remove('font-semibold', 'text-[#0F766E]');
                    activeStep.classList.add('text-text-primary');
                    activeIcon.parentElement.classList.remove('animate-pulse');

                    // Connector -> active color
                    connectors[currentStep].classList.replace('border-outline-variant', 'border-[#0F766E]');

                    // Next step -> active
                    currentStep++;
                    const nextStep = steps[currentStep];
                    nextStep.classList.remove('text-text-secondary', 'opacity-70');
                    nextStep.classList.add('text-text-primary');
                    
                    const nextIcon = nextStep.querySelector('.material-symbols-outlined');
                    nextIcon.textContent = 'radio_button_checked';
                    nextIcon.style.fontVariationSettings = "'FILL' 1";
                    
                    nextStep.querySelector('span:last-child').classList.add('font-semibold', 'text-[#0F766E]');
                    nextIcon.parentElement.classList.add('text-[#0F766E]', 'animate-pulse');
                }
            }

            // Simulate progress every 2 seconds
            setInterval(advanceStep, 2000);
        });
    </script>
